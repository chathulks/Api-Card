    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card border-0 shadow-lg rounded-5 col-4 p-5 mb-3">
            <h1>Number Ges.!</h1>
            <div class="mt-3">
                <h6 class="mb-3">Number ges start 0 to 10 number.</h6>
                <input type="number" class="form-control" id="userNumber" placeholder="Enter your number ges">

            <div class="mt-3">
                <button type="button" class="btn btn-warning" onclick="gesNumber()">Ges Number</button>
            </div>
            <div id="emailHelp" class="p-3 form-text text-center">We'll never share your number ges else.</div>
